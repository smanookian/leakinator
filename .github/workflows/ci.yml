name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux, with ffmpeg + tesseract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install ffmpeg and tesseract
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng
      - run: go vet ./...
      - run: go test -count=1 ./...

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Video tests skip themselves when ffmpeg or tesseract is missing.
      - run: go test -count=1 ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/ ./cmd/leakinator
          ls -l dist
          ./dist/leakinator --version
      - uses: actions/upload-artifact@v4
        with:
          name: leakinator-${{ runner.os }}
          path: dist/
